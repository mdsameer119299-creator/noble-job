name: PR CI

# Gate for the Production Trust Layer (PR #18) and future PRs: typecheck,
# provenance unit tests, static SEO verification, and a production build.
# Read-only — never applies migrations or touches any database.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches:
      - fix/production-trust-layer
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build runs with no real DB; the app falls back to local inventory when
      # Supabase is unconfigured (isSupabaseConfigured() === false).
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run type-check

      - name: Provenance tests
        run: npm run test:provenance

      - name: Candidate-acquisition tests
        run: npm run test:acq

      - name: Resume-launcher tests
        run: npm run test:resume

      - name: Resume-workspace tests
        run: npm run test:resume-workspace

      - name: Admin validation tests
        run: npm run test:admin

      - name: Admin route regression tests
        run: npm run test:admin-route

      - name: Egress-config tests
        run: npm run test:egress

      - name: SEO verification (static)
        run: npm run verify:seo

      - name: JobPosting schema checks
        run: npm run verify:job-schema

      - name: Build
        run: npm run build

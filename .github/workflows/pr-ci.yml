name: PR CI

# Gate for the Production Trust Layer (PR #18) and future PRs: typecheck,
# provenance unit tests, static SEO verification, and a production build.
# Read-only — never applies migrations or touches any database.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches:
      - fix/production-trust-layer
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build runs with no real DB; the app falls back to local inventory when
      # Supabase is unconfigured (isSupabaseConfigured() === false).
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run type-check

      - name: Provenance tests
        run: npm run test:provenance

      - name: Candidate-acquisition tests
        run: npm run test:acq

      - name: Resume-launcher tests
        run: npm run test:resume

      - name: Resume-workspace tests
        run: npm run test:resume-workspace

      - name: Resume-upload security tests
        run: npm run test:resume-security

      - name: Distributed rate-limit tests
        run: npm run test:rate-limit

      - name: PDF isolation / resource-limit tests
        run: npm run test:pdf-isolation

      - name: PDF runtime files are traced into the function
        run: npm run test:pdf-trace

      - name: Resume ReDoS / candidate scorer protection tests
        run: npm run test:resume-redos

      - name: CI chain-runner tests
        run: npm run test:ci-chain

      - name: Homepage query fan-out tests
        run: npm run test:homepage-queries

      - name: Admin validation tests
        run: npm run test:admin

      - name: Admin route regression tests
        run: npm run test:admin-route

      - name: Admin candidate intelligence tests
        run: npm run test:admin-candidates

      - name: Egress-config tests
        run: npm run test:egress

      - name: jobService withTimeout tests
        run: npm run test:jobservice-timeout

      - name: Ingest-run status tests
        run: npm run test:ingest-status

      # KNOWN BASELINE FAILURES (present on main @ 940a9ce, unrelated to this PR's changes):
      #   test:seo-jobposting (8), test:apply-route (3), test:source-dates (2).
      # This step runs EVERY suite in the test:seo-phase1 chain even after one fails (a plain `&&` chain stops
      # at the first failure and silently skips ~38 later suites). `continue-on-error` lets the independent
      # steps below (SEO verification, JobPosting schema, production build) still run; the final
      # "Enforce" step then FAILS THE JOB if this step failed. Failures stay visible and are never skipped.
      - name: SEO Phase 1 tests (JobPosting, sitemap, govt integrity, lifecycle, synthetic apply, no-empty-jobs, gate coverage, counts, apply route, apply state, source dates)
        id: seo_phase1
        continue-on-error: true
        run: node scripts/run-script-chain.mjs test:seo-phase1

      - name: Cron auth tests
        run: npm run test:cron-auth

      - name: SEO verification (static)
        run: npm run verify:seo

      - name: JobPosting schema checks
        run: npm run verify:job-schema

      - name: Build
        run: npm run build

      # Always runs (even if an earlier step failed) and turns the tolerated SEO Phase 1 failure back into a
      # failing job, so this workflow can only go green when those suites pass.
      - name: Enforce — SEO Phase 1 failures fail the job
        if: always()
        run: |
          if [ "${{ steps.seo_phase1.outcome }}" = "failure" ]; then
            echo "::error title=SEO Phase 1 suites failed::One or more test:seo-phase1 suites failed (see that step's log for the exact list). Later steps ran, but the job is failing on purpose."
            exit 1
          fi
          echo "SEO Phase 1 suites: ${{ steps.seo_phase1.outcome }}"
